<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" viewBox="0 0 512 512" width="512" height="512" role="img" aria-labelledby="title desc">
  <title id="title">bytab — App Icon</title>
  <desc id="desc">A white browser window and peach bookmark over a lavender sunrise and layers of blue mountains.</desc>
  <defs>
    <linearGradient id="sky" x1="0.08" y1="0" x2="0.89" y2="0.92" objectBoundingBox="true">
      <stop offset="0" stop-color="#B9C4F4"/>
      <stop offset="0.28" stop-color="#CEB9E9"/>
      <stop offset="0.56" stop-color="#E8B7D0"/>
      <stop offset="0.83" stop-color="#FFC0AD"/>
      <stop offset="1" stop-color="#FFCFAB"/>
    </linearGradient>
    <radialGradient id="morningGlow" cx="0.83" cy="0.73" r="0.73">
      <stop offset="0" stop-color="#FFD1AF" stop-opacity="0.83"/>
      <stop offset="0.48" stop-color="#FFC7BC" stop-opacity="0.18"/>
      <stop offset="1" stop-color="#E8D5FF" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="distantMountain" x1="0" y1="0" x2="0.7" y2="1">
      <stop offset="0" stop-color="#9D9CCB"/>
      <stop offset="1" stop-color="#B7A1C9"/>
    </linearGradient>
    <linearGradient id="middleMountain" x1="0" y1="0" x2="0.8" y2="1">
      <stop offset="0" stop-color="#899BC9"/>
      <stop offset="1" stop-color="#8195C4"/>
    </linearGradient>
    <linearGradient id="foregroundMountain" x1="0" y1="0" x2="0.8" y2="1">
      <stop offset="0" stop-color="#748AB9"/>
      <stop offset="1" stop-color="#607FAA"/>
    </linearGradient>
    <linearGradient id="windowWhite" x1="0" y1="0" x2="0.93" y2="1">
      <stop offset="0" stop-color="#FFFFFF"/>
      <stop offset="1" stop-color="#FDFBFF"/>
    </linearGradient>
    <linearGradient id="bookmarkPeach" x1="0" y1="0" x2="0.9" y2="1">
      <stop offset="0" stop-color="#FFE5D0"/>
      <stop offset="1" stop-color="#FFD2B0"/>
    </linearGradient>
    <clipPath id="iconShape">
      <rect width="512" height="512" rx="128" ry="128"/>
    </clipPath>
    <filter id="softLift" x="-15%" y="-17%" width="130%" height="140%">
      <feGaussianBlur in="SourceAlpha" stdDeviation="3" result="blur"/>
      <feOffset in="blur" dy="3" result="offset"/>
      <feComponentTransfer in="offset" result="faded"><feFuncA type="linear" slope="0.11"/></feComponentTransfer>
      <feMerge><feMergeNode in="faded"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
  </defs>

  <!-- Whole artwork is clipped to a true rounded-square app-icon silhouette. -->
  <g clip-path="url(#iconShape)">
    <rect width="512" height="512" fill="url(#sky)"/>
    <rect width="512" height="512" fill="url(#morningGlow)"/>

    <!-- Misty, gently overlapping sunrise mountain ranges. -->
    <path d="M-15 358 C11 362 23 371 42 367 C68 361 76 380 107 374 C136 368 157 379 182 383 C212 390 228 401 249 401 C273 400 294 384 324 383 C361 380 395 394 425 403 C455 407 480 392 527 376 L527 527 H-15 Z" fill="url(#distantMountain)" opacity="0.75"/>
    <path d="M-18 419 C25 416 54 429 82 431 C116 435 145 452 174 450 C208 445 244 434 272 441 C312 450 341 464 372 454 C408 442 445 409 474 397 L528 375 L528 526 H-18 Z" fill="url(#middleMountain)" opacity="0.68"/>
    <path d="M-16 425 C29 430 57 437 82 446 C112 455 146 465 177 464 C207 464 225 461 245 461 C282 464 313 469 347 463 C391 455 423 453 453 451 C484 451 510 448 529 444 L529 528 H-16 Z" fill="url(#foregroundMountain)" opacity="0.84"/>
    <path d="M-16 467 C36 462 87 483 119 483 C168 484 198 475 235 483 C268 491 315 493 355 481 C410 467 470 480 528 463 L528 528 H-16 Z" fill="#6683B0" opacity="0.23"/>

    <!-- The browser/tab shape is drawn as a true, editable vector. -->
    <g filter="url(#softLift)">
      <path fill="url(#windowWhite)" fill-rule="evenodd" d="
        M 158 121
        H 278
        C 296 121 307 130 317 149
        C 321 156 325 156 331 156
        H 372
        C 401 156 421 176 421 207
        V 340
        C 421 369 402 388 374 388
        H 157
        C 126 388 106 367 106 338
        V 173
        C 106 140 127 121 158 121
        Z
        M 153 195
        H 374
        C 389 195 402 206 402 222
        V 335
        C 402 355 388 368 368 368
        H 157
        C 136 368 125 355 125 336
        V 223
        C 125 206 137 195 153 195
        Z"/>
      <!-- Three browser controls -->
      <circle cx="159" cy="160" r="13.5" fill="#948DB8"/>
      <circle cx="199" cy="160" r="13.5" fill="#9189B6"/>
      <circle cx="239" cy="160" r="13.5" fill="#938AB8"/>
      <!-- Bookmark ribbon -->
      <path d="M 297 220 H 350 C 359 220 366 227 366 237 V 318 C 366 324 361 328 355 324 L 324 302 L 292 326 C 286 330 280 325 280 318 V 237 C 280 227 287 220 297 220 Z" fill="url(#bookmarkPeach)"/>
    </g>

    <rect x="0.5" y="0.5" width="511" height="511" rx="127.5" fill="none" stroke="#FFFFFF" stroke-opacity="0.19"/>
  </g>
</svg>
